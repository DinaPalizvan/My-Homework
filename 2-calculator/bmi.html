<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI-Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form action="/bmi-calculator" method="post">
        <label for="height">Enter your height in meter:</label>
        <input type="text" placeholder="Enter your height" name="height">
        <label for="weight">Enter your weight in kilogram:</label>
        <input type="text" placeholder="Enter your weight" name="weight">
        <button type="submit">Calculate</button>

    </form>
</body>
</html>
