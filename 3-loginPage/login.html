<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; background-color: rgb(205, 129, 255); height: 90vh;">
    <form action="/" method="post" style="display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: rgb(0, 180, 180); padding: 30px; border: 0; border-radius: 10px; box-shadow: 0 0 20px darkcyan;">
        <label for="user">Enter your username:</label><br>
        <input type="text" placeholder="username" name="user"><br>
        <label for="pass">Enter your password:</label><br>
        <input type="text" placeholder="password" name="pass"><br>
        <button type="submit">Enter</button>
    </form>
</body>
</html>
